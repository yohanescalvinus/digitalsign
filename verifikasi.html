<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verifikasi Digital Signature</title>
<style>
  :root {
    --bg: #f0f2f5; --card: #ffffff; --text: #222; --text-muted: #666;
    --label: #333; --border: #ccc; --border-light: #ddd; --input-bg: #fff;
    --primary: #0b5ed7; --primary-hover: #0a4fb8;
    --secondary: #6c757d; --secondary-hover: #565e64;
    --success: #198754; --success-hover: #157347; --success-bg: #e7f8ee;
    --danger: #dc3545; --error-bg: #ffe7e7;
    --info-bg: #e7f5ff; --warn-bg: #fff3cd; --warn-text: #856404;
    --warn-border: #ffc107; --shadow: rgba(0,0,0,0.1);
    --preview-bg: #f8f9ff; --preview-border: #0b5ed7;
  }
  [data-theme="dark"] {
    --bg: #121212; --card: #1e1e1e; --text: #e8e8e8; --text-muted: #999;
    --label: #ccc; --border: #444; --border-light: #3a3a3a; --input-bg: #2a2a2a;
    --primary: #4d9fff; --primary-hover: #3a8ce6;
    --secondary: #555; --secondary-hover: #666;
    --success: #2ea66d; --success-hover: #268c5c; --success-bg: #1a3d2c;
    --danger: #ef5350; --error-bg: #4a1f1f;
    --info-bg: #1a3a52; --warn-bg: #4a3a1a; --warn-text: #ffcc66;
    --warn-border: #cc9900; --shadow: rgba(0,0,0,0.5);
    --preview-bg: #1a2a3d; --preview-border: #4d9fff;
  }
  * { box-sizing: border-box; transition: background-color 0.25s, color 0.25s, border-color 0.25s; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg); color: var(--text);
    margin: 0; padding: 20px;
    display: flex; justify-content: center; min-height: 100vh;
  }
  .container {
    background: var(--card); padding: 30px; border-radius: 12px;
    box-shadow: 0 4px 20px var(--shadow);
    max-width: 560px; width: 100%;
  }
  h1 { font-size: 20px; margin-top: 0; }
  .row { margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--label); font-size: 13px; }
  input, textarea {
    width: 100%; padding: 9px 10px;
    border: 1px solid var(--border); border-radius: 6px;
    font-size: 14px; font-family: inherit;
    background: var(--input-bg); color: var(--text);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); }
  textarea { resize: vertical; }
  textarea.mono { font-family: monospace; font-size: 12px; }
  button {
    background: var(--primary); color: #fff; border: none;
    padding: 11px 18px; border-radius: 6px;
    font-size: 14px; cursor: pointer; font-weight: 600;
    margin-right: 8px; margin-top: 4px;
  }
  button:hover { background: var(--primary-hover); }
  button.secondary { background: var(--secondary); }
  button.secondary:hover { background: var(--secondary-hover); }
  button.success { background: var(--success); }
  button.success:hover { background: var(--success-hover); }
  .tabs {
    display: flex; gap: 0; margin-bottom: 15px;
    border-bottom: 2px solid var(--border-light);
  }
  .tab {
    padding: 8px 16px; cursor: pointer;
    font-size: 13px; font-weight: 600;
    color: var(--text-muted);
    border-bottom: 2px solid transparent;
    margin-bottom: -2px; background: none; border-radius: 0;
    margin-right: 0;
  }
  .tab.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab:hover { color: var(--primary); background: none; }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  #decryptResult {
    margin-top: 15px; padding: 12px;
    border-radius: 8px; background: var(--info-bg);
    border-left: 4px solid var(--primary);
    display: none; text-align: left; font-size: 14px;
  }
  #decryptResult.error { background: var(--error-bg); border-left-color: var(--danger); }
  #decryptResult.success { background: var(--success-bg); border-left-color: var(--success); }
  #decryptResult .msg-box {
    margin-top: 10px; padding: 10px; background: var(--card);
    border-left: 3px solid var(--success); border-radius: 4px;
    font-style: italic;
  }
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute; right: 10px; top: 50%;
    transform: translateY(-50%); cursor: pointer; font-size: 16px;
    user-select: none; color: var(--text-muted);
    background: none; padding: 4px; border: none; margin: 0;
    width: auto; height: auto;
  }
  .pw-toggle:hover { background: none; }
  .lock-indicator {
    font-size: 11px; margin-top: 6px; padding: 6px 10px;
    border-radius: 6px; border-left: 3px solid;
    background: var(--warn-bg); color: var(--warn-text);
    border-left-color: var(--warn-border);
  }
  .lock-indicator.weak { background: var(--error-bg); color: var(--danger); border-left-color: var(--danger); }
  .lock-indicator.medium { background: var(--info-bg); color: var(--primary); border-left-color: var(--primary); }
  .lock-indicator.strong { background: var(--success-bg); color: var(--success); border-left-color: var(--success); }
  .theme-toggle {
    position: fixed; top: 20px; right: 20px; z-index: 999;
    width: 46px; height: 46px; border-radius: 50%;
    background: var(--card); color: var(--text);
    border: 2px solid var(--border);
    box-shadow: 0 4px 12px var(--shadow);
    cursor: pointer; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    padding: 0; margin: 0;
  }
  .theme-toggle:hover { transform: scale(1.1); background: var(--card); }
  #status { margin-top: 10px; font-size: 12px; padding: 6px 10px; border-radius: 6px; display: none; }
  #status.ok { background: var(--success-bg); color: var(--success); display: block; }
  #status.err { background: var(--error-bg); color: var(--danger); display: block; }
  .note { font-size: 12px; color: var(--text-muted); margin-top: 15px; }
  .pdf-drop {
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 30px 20px; text-align: center; cursor: pointer;
    background: var(--input-bg); margin-bottom: 12px;
  }
  .pdf-drop:hover, .pdf-drop.dragover { border-color: var(--primary); background: var(--preview-bg); }
  .pdf-drop-icon { font-size: 36px; margin-bottom: 8px; }
  .pdf-drop-text { font-size: 14px; }
  .pdf-drop-hint { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  #pdfPreview {
    display: none; max-height: 300px; overflow: auto;
    border: 1px solid var(--border-light); border-radius: 8px;
    padding: 10px; background: var(--input-bg); margin-top: 10px;
  }
  #pdfPreview canvas {
    max-width: 100%; height: auto; display: block;
    margin: 0 auto 10px; border: 1px solid var(--border-light);
    border-radius: 4px;
  }
  #pdfInfo { font-size: 12px; color: var(--text-muted); margin-top: 8px; text-align: center; }
  .spinner {
    display: inline-block; width: 16px; height: 16px;
    border: 2px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle; margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .result-item {
    margin-top: 10px; padding: 10px;
    background: var(--card); border-radius: 6px;
    border-left: 3px solid var(--primary); font-size: 13px;
  }
  .result-item.success { border-left-color: var(--success); }
  .result-item.error { border-left-color: var(--danger); }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="container">
  <h1>🔍 Verifikasi Digital Signature</h1>
  <p class="note" style="margin-top:0;">Scan QR atau upload PDF untuk memverifikasi keaslian dokumen.</p>

  <div id="status"></div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('text')" id="tabText">📝 Teks / QR Gambar</button>
    <button class="tab" onclick="switchTab('pdf')" id="tabPdf">📄 Dari PDF</button>
  </div>

  <!-- TAB 1 -->
  <div class="tab-content active" id="contentText">
    <div class="row">
      <label>Scan QR atau tempel payload terenkripsi</label>
      <textarea id="encryptedInput" class="mono" rows="5" placeholder="Tempel ciphertext AES..."></textarea>
    </div>
    <div class="row">
      <label>🔑 Password</label>
      <div class="pw-wrap">
        <input type="password" id="secretDecrypt" placeholder="Masukkan password..."
               oninput="updateLockIndicator('secretDecrypt', 'lockIndicatorDecrypt')" />
        <button type="button" class="pw-toggle" onclick="togglePassword('secretDecrypt', this)">👁️</button>
      </div>
      <div id="lockIndicatorDecrypt" class="lock-indicator"></div>
    </div>

    <button class="success" onclick="decryptPayload()">🔓 Verifikasi</button>
    <button class="secondary" onclick="pasteClipboard()">📋 Paste</button>
    <button class="secondary" onclick="scanFromImage()">🖼️ Scan QR dari Gambar</button>

    <input type="file" id="qrFile" accept="image/*" style="display:none" onchange="handleQRFile(event)" />
    <canvas id="scanCanvas" style="display:none;"></canvas>

    <div id="decryptResult"></div>
  </div>

  <!-- TAB 2 -->
  <div class="tab-content" id="contentPdf">
    <div class="row">
      <label>Upload Dokumen PDF</label>
      <div class="pdf-drop" id="pdfDrop" onclick="document.getElementById('pdfFile').click()">
        <div class="pdf-drop-icon">📄</div>
        <div class="pdf-drop-text"><b>Klik</b> atau <b>drag & drop</b> file PDF di sini</div>
        <div class="pdf-drop-hint">QR pada halaman PDF akan otomatis dipindai</div>
      </div>
      <input type="file" id="pdfFile" accept="application/pdf,.pdf" style="display:none" onchange="handlePDFFile(event)" />
    </div>

    <div class="row">
      <label>🔑 Password</label>
      <div class="pw-wrap">
        <input type="password" id="secretDecryptPdf" placeholder="Masukkan password..."
               oninput="updateLockIndicator('secretDecryptPdf', 'lockIndicatorPdf')" />
        <button type="button" class="pw-toggle" onclick="togglePassword('secretDecryptPdf', this)">👁️</button>
      </div>
      <div id="lockIndicatorPdf" class="lock-indicator"></div>
    </div>

    <div id="pdfPreview"></div>
    <div id="pdfInfo"></div>
    <div id="pdfResult"></div>
  </div>
</div>

<script src="crypto-js.min.js"></script>
<script src="jsQR.js"></script>
<script src="pdf.min.js"></script>

<script>
/* ============ KONSTANTA ============ */
const DEFAULT_SECRET = 'DIGITAL-SIGNATURE-DEFAULT-KEY-2024';
function resolveSecret(input) {
  const s = (input || '').trim();
  return s.length > 0 ? s : DEFAULT_SECRET;
}

/* ============ TEMA ============ */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', theme);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function () {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
  });
})();

/* ============ TABS ============ */
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (tab === 'text') {
    document.getElementById('tabText').classList.add('active');
    document.getElementById('contentText').classList.add('active');
  } else {
    document.getElementById('tabPdf').classList.add('active');
    document.getElementById('contentPdf').classList.add('active');
  }
}

/* ============ PASSWORD ============ */
function togglePassword(id, btn) {
  const i = document.getElementById(id);
  if (i.type === 'password') { i.type = 'text'; btn.textContent = '🙈'; }
  else { i.type = 'password'; btn.textContent = '👁️'; }
}
function updateLockIndicator(inputId, indicatorId) {
  const val = document.getElementById(inputId).value.trim();
  const el = document.getElementById(indicatorId);
  el.classList.remove('weak', 'medium', 'strong');
  if (val.length === 0) {
    el.innerHTML = '⚠️ Kosong — akan coba dengan kunci default';
  } else if (val.length < 6) {
    el.classList.add('weak');
    el.innerHTML = '🔓 Password pendek.';
  } else if (val.length < 10) {
    el.classList.add('medium');
    el.innerHTML = '🔐 Password cukup kuat.';
  } else {
    el.classList.add('strong');
    el.innerHTML = '🔒 Password kuat.';
  }
}

/* ============ INIT ============ */
window.addEventListener('DOMContentLoaded', function () {
  const status = document.getElementById('status');
  const checks = [
    { name: 'CryptoJS', ok: typeof CryptoJS !== 'undefined' },
    { name: 'jsQR',     ok: typeof jsQR !== 'undefined' },
    { name: 'pdf.js',   ok: typeof pdfjsLib !== 'undefined' }
  ];
  const gagal = checks.filter(c => !c.ok);
  if (gagal.length === 0) {
    status.className = 'ok';
    status.textContent = '✅ Siap digunakan';
    setTimeout(() => status.style.display = 'none', 3000);
  } else {
    status.className = 'err';
    status.innerHTML = '❌ Library gagal dimuat: <b>' + gagal.map(c => c.name).join(', ') + '</b>';
  }

  if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';
  }

  updateLockIndicator('secretDecrypt', 'lockIndicatorDecrypt');
  updateLockIndicator('secretDecryptPdf', 'lockIndicatorPdf');

  // Setup drag & drop PDF
  const drop = document.getElementById('pdfDrop');
  ['dragenter', 'dragover'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('dragover'); });
  });
  ['dragleave', 'drop'].forEach(ev => {
    drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('dragover'); });
  });
  drop.addEventListener('drop', e => {
    const file = e.dataTransfer.files[0];
    if (file) handlePDFFile({ target: { files: [file], value: '' } });
  });
});

/* ============ DECRYPT CORE ============ */
function doDecrypt(encrypted, secretInput) {
  if (!encrypted) return { ok: false, error: 'Payload kosong.' };
  const secret = resolveSecret(secretInput);
  try {
    const decrypted = CryptoJS.AES.decrypt(encrypted, secret).toString(CryptoJS.enc.Utf8);
    if (!decrypted) throw new Error('Kunci salah');
    const data = JSON.parse(decrypted);
    return { ok: true, data };
  } catch (e) {
    return { ok: false, error: 'Password salah atau data rusak.' };
  }
}

function renderResult(data, secretInput) {
  // Deteksi pintar: kalau field `locked` tidak ada (QR lama), fallback ke cek password input
  let locked;
  if (typeof data.locked === 'boolean') {
    locked = data.locked;
  } else {
    locked = (secretInput || '').trim().length > 0;
  }
  const lockBadge = locked
    ? '<span style="color:var(--success);">🔒 Terkunci</span>'
    : '<span style="color:var(--warn-text);">⚠️ Tidak terkunci</span>';

  return `
    <b>✅ Verifikasi BERHASIL:</b> ${lockBadge}<br/><br/>
    <b>Nama</b>      : ${esc(data.nama)}<br/>
    <b>Institusi</b> : ${esc(data.institusi)}<br/>
    <b>Jabatan</b>   : ${esc(data.jabatan)}<br/>
    <b>Tanggal</b>   : ${esc(data.tanggal)}<br/>
    <b>Timestamp</b> : ${new Date(data.ts).toLocaleString('id-ID')}
    ${data.pesan ? `<div class="msg-box">💬 <b>Pesan:</b> ${esc(data.pesan)}</div>` : ''}
  `;
}

/* ============ TAB 1: DECRYPT ============ */
function decryptPayload() {
  const encrypted = document.getElementById('encryptedInput').value.trim();
  const secret    = document.getElementById('secretDecrypt').value;
  const box = document.getElementById('decryptResult');
  box.className = ''; box.style.display = 'block';

  const res = doDecrypt(encrypted, secret);
  if (res.ok) {
    box.className = 'success';
    box.innerHTML = renderResult(res.data, secret);
  } else {
    box.className = 'error';
    box.innerHTML = '❌ ' + res.error;
  }
}

/* ============ HELPER ============ */
function pasteClipboard() {
  navigator.clipboard.readText()
    .then(t => document.getElementById('encryptedInput').value = t.trim())
    .catch(() => alert('Tidak bisa akses clipboard.'));
}
function scanFromImage() {
  if (typeof jsQR === 'undefined') { alert('jsQR belum ter-load.'); return; }
  document.getElementById('qrFile').click();
}
function handleQRFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = function () {
    const canvas = document.getElementById('scanCanvas');
    canvas.width = img.width; canvas.height = img.height;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    let code = null;
    try { code = jsQR(imageData.data, imageData.width, imageData.height); } catch (e) { console.error(e); }
    if (code && code.data) {
      document.getElementById('encryptedInput').value = code.data;
      decryptPayload();
    } else {
      const box = document.getElementById('decryptResult');
      box.className = 'error'; box.style.display = 'block';
      box.innerHTML = '❌ QR tidak terdeteksi.';
    }
    event.target.value = '';
  };
  img.src = URL.createObjectURL(file);
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ============ TAB 2: PDF ============ */
async function handlePDFFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const preview = document.getElementById('pdfPreview');
  const info    = document.getElementById('pdfInfo');
  const result  = document.getElementById('pdfResult');

  preview.style.display = 'block';
  preview.innerHTML = '<div style="text-align:center; padding:20px;"><span class="spinner"></span> Memuat PDF...</div>';
  info.textContent = '';
  result.innerHTML = '';

  if (typeof pdfjsLib === 'undefined') {
    preview.innerHTML = '<div style="color:var(--danger); text-align:center; padding:10px;">❌ pdf.js tidak ter-load.</div>';
    return;
  }

  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const totalPages = pdf.numPages;

    preview.innerHTML = '';
    info.textContent = `📄 ${file.name} — ${totalPages} halaman`;

    const scanResults = [];

    for (let pageNum = 1; pageNum <= totalPages; pageNum++) {
      const page = await pdf.getPage(pageNum);
      const viewport = page.getViewport({ scale: 2.0 });

      const canvas = document.createElement('canvas');
      canvas.width  = viewport.width;
      canvas.height = viewport.height;
      canvas.style.maxWidth = '100%';
      canvas.style.marginBottom = '8px';

      const ctx = canvas.getContext('2d');
      await page.render({ canvasContext: ctx, viewport }).promise;

      preview.appendChild(canvas);
      const pageLabel = document.createElement('div');
      pageLabel.style.cssText = 'font-size:11px; color:var(--text-muted); text-align:center; margin-bottom:12px;';
      pageLabel.textContent = `Halaman ${pageNum}`;
      preview.appendChild(pageLabel);

      if (typeof jsQR !== 'undefined') {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        let code = null;
        try { code = jsQR(imageData.data, imageData.width, imageData.height); } catch (e) { console.error(e); }
        if (code && code.data) {
          scanResults.push({ page: pageNum, data: code.data });
        }
      }
    }

    if (scanResults.length === 0) {
      result.innerHTML = `<div class="result-item error">❌ Tidak ada QR Code yang terdeteksi di ${totalPages} halaman PDF ini.</div>`;
      return;
    }

    const secret = document.getElementById('secretDecryptPdf').value;
    let html = `<div style="margin-top:12px;"><b>🎯 Ditemukan ${scanResults.length} QR:</b></div>`;

    for (const sr of scanResults) {
      const res = doDecrypt(sr.data, secret);
      if (res.ok) {
        let locked;
        if (typeof res.data.locked === 'boolean') locked = res.data.locked;
        else locked = secret.trim().length > 0;

        html += `<div class="result-item success">
          <b>✅ Halaman ${sr.page} — Verifikasi BERHASIL:</b> ${locked ? '🔒' : '⚠️'}<br/><br/>
          <b>Nama</b>      : ${esc(res.data.nama)}<br/>
          <b>Institusi</b> : ${esc(res.data.institusi)}<br/>
          <b>Jabatan</b>   : ${esc(res.data.jabatan)}<br/>
          <b>Tanggal</b>   : ${esc(res.data.tanggal)}<br/>
          <b>Timestamp</b> : ${new Date(res.data.ts).toLocaleString('id-ID')}
          ${res.data.pesan ? `<div class="msg-box">💬 <b>Pesan:</b> ${esc(res.data.pesan)}</div>` : ''}
        </div>`;
      } else {
        html += `<div class="result-item error">
          <b>❌ Halaman ${sr.page} — Gagal decrypt:</b> ${esc(res.error)}<br/>
          <span style="font-size:11px; color:var(--text-muted);">Payload: ${esc(sr.data.substring(0, 60))}...</span>
        </div>`;
      }
    }
    result.innerHTML = html;

  } catch (err) {
    console.error(err);
    preview.innerHTML = `<div style="color:var(--danger); text-align:center; padding:10px;">❌ Gagal membaca PDF: ${esc(err.message)}</div>`;
  } finally {
    event.target.value = '';
  }
}
</script>
<script src="disclaimer.js"></script>
</body>
</html>
