<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Generate Digital Signature</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #222;
    --text-muted: #666;
    --label: #333;
    --border: #ccc;
    --input-bg: #fff;
    --primary: #0b5ed7;
    --primary-hover: #0a4fb8;
    --secondary: #6c757d;
    --secondary-hover: #565e64;
    --success: #198754;
    --success-bg: #e7f8ee;
    --danger: #dc3545;
    --error-bg: #ffe7e7;
    --info-bg: #e7f5ff;
    --warn-bg: #fff3cd;
    --warn-text: #856404;
    --warn-border: #ffc107;
    --shadow: rgba(0,0,0,0.1);
    --preview-bg: #f8f9ff;
    --preview-border: #0b5ed7;
  }
  [data-theme="dark"] {
    --bg: #121212;
    --card: #1e1e1e;
    --text: #e8e8e8;
    --text-muted: #999;
    --label: #ccc;
    --border: #444;
    --input-bg: #2a2a2a;
    --primary: #4d9fff;
    --primary-hover: #3a8ce6;
    --secondary: #555;
    --secondary-hover: #666;
    --success: #2ea66d;
    --success-bg: #1a3d2c;
    --danger: #ef5350;
    --error-bg: #4a1f1f;
    --info-bg: #1a3a52;
    --warn-bg: #4a3a1a;
    --warn-text: #ffcc66;
    --warn-border: #cc9900;
    --shadow: rgba(0,0,0,0.5);
    --preview-bg: #1a2a3d;
    --preview-border: #4d9fff;
  }

  * { box-sizing: border-box; transition: background-color 0.25s, color 0.25s, border-color 0.25s; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    margin: 0;
    padding: 20px;
    display: flex;
    justify-content: center;
    min-height: 100vh;
  }
  .container {
    background: var(--card);
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 4px 20px var(--shadow);
    max-width: 560px;
    width: 100%;
  }
  h1 { font-size: 20px; margin-top: 0; color: var(--text); }
  .subtitle { color: var(--text-muted); font-size: 13px; margin-top: -8px; margin-bottom: 20px; }
  .row { margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 5px; color: var(--label); font-size: 13px; }
  input, textarea {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    background: var(--input-bg);
    color: var(--text);
  }
  input:focus, textarea:focus { outline: none; border-color: var(--primary); }
  textarea { resize: vertical; }
  button {
    background: var(--primary);
    color: #fff;
    border: none;
    padding: 11px 18px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    margin-right: 8px;
    margin-top: 4px;
  }
  button:hover { background: var(--primary-hover); }
  button.secondary { background: var(--secondary); }
  button.secondary:hover { background: var(--secondary-hover); }

  /* ============ PREVIEW: HANYA QR CODE ============ */
  #preview {
    margin-top: 24px;
    padding: 30px 20px;
    border: 2px dashed var(--preview-border);
    border-radius: 12px;
    background: var(--preview-bg);
    display: none;
    text-align: center;
    animation: fadeIn 0.4s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #qrcode {
    display: inline-block;
    padding: 16px;
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  #qrcode img, #qrcode canvas { display: block; }

  /* ============ PASSWORD ============ */
  .pw-wrap { position: relative; }
  .pw-toggle {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 16px;
    user-select: none;
    color: var(--text-muted);
    background: none;
    padding: 4px;
    border: none;
    margin: 0;
    width: auto;
    height: auto;
  }
  .pw-toggle:hover { background: none; }
  .lock-indicator {
    font-size: 11px;
    margin-top: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    border-left: 3px solid var(--warn-border);
    background: var(--warn-bg);
    color: var(--warn-text);
  }
  .lock-indicator.weak { background: var(--error-bg); color: var(--danger); border-left-color: var(--danger); }
  .lock-indicator.medium { background: var(--info-bg); color: var(--primary); border-left-color: var(--primary); }
  .lock-indicator.strong { background: var(--success-bg); color: var(--success); border-left-color: var(--success); }

  /* ============ THEME TOGGLE ============ */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 999;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--card);
    color: var(--text);
    border: 2px solid var(--border);
    box-shadow: 0 4px 12px var(--shadow);
    cursor: pointer;
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    margin: 0;
  }
  .theme-toggle:hover { transform: scale(1.1); background: var(--card); }

  /* ============ STATUS ============ */
  #status {
    margin-top: 10px;
    font-size: 12px;
    padding: 6px 10px;
    border-radius: 6px;
    display: none;
  }
  #status.ok { background: var(--success-bg); color: var(--success); display: block; }
  #status.err { background: var(--error-bg); color: var(--danger); display: block; }

  .note { font-size: 12px; color: var(--text-muted); margin-top: 16px; line-height: 1.5; }
</style>
</head>
<body>

<button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>

<div class="container">
  <h1>🔏 Generate Digital Signature</h1>
  <p class="subtitle">Buat QR Code sebagai tanda tangan digital terenkripsi.</p>

  <div id="status"></div>

  <div class="row">
    <label>Nama</label>
    <input type="text" id="nama" placeholder="Contoh: Budi Santoso" />
  </div>
  <div class="row">
    <label>Institusi</label>
    <input type="text" id="institusi" placeholder="Contoh: PT Maju Jaya" />
  </div>
  <div class="row">
    <label>Jabatan</label>
    <input type="text" id="jabatan" placeholder="Contoh: Direktur" />
  </div>
  <div class="row">
    <label>Tanggal</label>
    <input type="date" id="tanggal" />
  </div>
  <div class="row">
    <label>🔑 Password <span style="font-weight:400;color:var(--text-muted);font-size:12px;">(opsional — untuk mengunci dokumen)</span></label>
    <div class="pw-wrap">
      <input type="password" id="secret" placeholder="Masukkan password untuk mengunci dokumen digital sign Anda!"
             oninput="updateLockIndicator('secret', 'lockIndicator')" />
      <button type="button" class="pw-toggle" onclick="togglePassword('secret', this)">👁️</button>
    </div>
    <div id="lockIndicator" class="lock-indicator"></div>
  </div>
  <div class="row">
    <label>📝 Pesan Singkat</label>
    <textarea id="pesan" rows="2" maxlength="200" placeholder="Contoh: Dokumen ini sah dan telah disetujui."></textarea>
  </div>

  <button onclick="generateSignature()">🔏 Generate QR</button>
  <button class="secondary" onclick="downloadPNG()">⬇️ Download PNG</button>
  <button class="secondary" onclick="copyPayload()">📋 Copy Payload</button>

  <!-- PREVIEW: HANYA QR CODE -->
  <div id="preview">
    <div id="qrcode"></div>
  </div>

  <p class="note">
    * Semua informasi tersimpan <b>di dalam QR Code</b> dalam bentuk terenkripsi AES-256.<br/>
    * File PNG disimpan dengan nama tanggal tanda tangan.<br/>
    * Untuk verifikasi, buka aplikasi <b>verify.html</b> dan scan QR Code.
  </p>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script src="crypto-js.min.js"></script>
<script src="qrcode.min.js"></script>

<script>
/* ============ KONSTANTA ============ */
const DEFAULT_SECRET = 'DIGITAL-SIGNATURE-DEFAULT-KEY-2024';

/* ============ TEMA ============ */
function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  const btn = document.getElementById('themeBtn');
  if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  localStorage.setItem('theme', theme);
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'light';
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function () {
  const saved = localStorage.getItem('theme') || 'light';
  document.documentElement.setAttribute('data-theme', saved);
  window.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('themeBtn');
    if (btn) btn.textContent = saved === 'dark' ? '☀️' : '🌙';
  });
})();

/* ============ PASSWORD HELPERS ============ */
function togglePassword(id, btn) {
  const i = document.getElementById(id);
  if (i.type === 'password') { i.type = 'text'; btn.textContent = '🙈'; }
  else { i.type = 'password'; btn.textContent = '👁️'; }
}
function updateLockIndicator(inputId, indicatorId) {
  const val = document.getElementById(inputId).value.trim();
  const el = document.getElementById(indicatorId);
  el.classList.remove('weak', 'medium', 'strong');
  if (val.length === 0) {
    el.innerHTML = '⚠️ Kosong — QR Code <b>TIDAK terkunci</b>. Siapa pun bisa membacanya.';
  } else if (val.length < 6) {
    el.classList.add('weak');
    el.innerHTML = '🔓 Password <b>lemah</b> — minimal 8 karakter disarankan.';
  } else if (val.length < 10) {
    el.classList.add('medium');
    el.innerHTML = '🔐 Password cukup kuat.';
  } else {
    el.classList.add('strong');
    el.innerHTML = '🔒 Password kuat — QR Code aman terkunci.';
  }
}

/* ============ INIT ============ */
window.addEventListener('DOMContentLoaded', function () {
  const status = document.getElementById('status');
  const checks = [
    { name: 'CryptoJS', ok: typeof CryptoJS !== 'undefined' },
    { name: 'QRCode',   ok: typeof QRCode !== 'undefined' }
  ];
  const gagal = checks.filter(c => !c.ok);
  if (gagal.length === 0) {
    status.className = 'ok';
    status.textContent = '✅ Siap digunakan';
    setTimeout(() => status.style.display = 'none', 3000);
  } else {
    status.className = 'err';
    status.innerHTML = '❌ Library gagal dimuat: <b>' + gagal.map(c => c.name).join(', ') + '</b>';
  }

  document.getElementById('tanggal').valueAsDate = new Date();
  updateLockIndicator('secret', 'lockIndicator');
});

/* ============ GENERATE — FOKUS HANYA QR CODE ============ */
function generateSignature() {
  try {
    const nama      = document.getElementById('nama').value.trim();
    const institusi = document.getElementById('institusi').value.trim();
    const jabatan   = document.getElementById('jabatan').value.trim();
    const tanggal   = document.getElementById('tanggal').value;
    const secretRaw = document.getElementById('secret').value;
    const pesan     = document.getElementById('pesan').value.trim();

    if (!nama || !institusi || !jabatan || !tanggal) {
      alert('Mohon lengkapi semua data!');
      return;
    }
    if (typeof CryptoJS === 'undefined' || typeof QRCode === 'undefined') {
      alert('Library belum siap.');
      return;
    }

    const locked = secretRaw.trim().length > 0;

    // Konfirmasi kalau tidak terkunci
    if (!locked) {
      const ok = confirm(
        '⚠️ Anda belum memasukkan password.\n\n' +
        'QR Code akan dibuat TANPA kunci (kunci default).\n' +
        'Siapa pun yang memiliki file ini bisa membacanya.\n\n' +
        'Lanjutkan?'
      );
      if (!ok) {
        const i = document.getElementById('secret');
        i.focus();
        i.style.borderColor = '#dc3545';
        setTimeout(() => i.style.borderColor = '', 2000);
        return;
      }
    }

    const secret = locked ? secretRaw.trim() : DEFAULT_SECRET;

    // Payload lengkap tersembunyi di dalam QR
    const payload = JSON.stringify({
      nama,
      institusi,
      jabatan,
      tanggal,
      pesan: pesan || '',
      locked: locked,
      ts: Date.now()
    });

    const encrypted = CryptoJS.AES.encrypt(payload, secret).toString();

    // Render QR BESAR (360px) — fokus utama, tanpa caption
    const qrContainer = document.getElementById('qrcode');
    qrContainer.innerHTML = '';
    new QRCode(qrContainer, {
      text: encrypted,
      width: 360,
      height: 360,
      colorDark: '#000000',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });

    // Simpan payload + tanggal untuk tombol Download / Copy
    qrContainer.setAttribute('data-encrypted', encrypted);
    qrContainer.setAttribute('data-tanggal', tanggal);

    document.getElementById('preview').style.display = 'block';

    // Auto scroll ke preview
    setTimeout(() => {
      document.getElementById('preview').scrollIntoView({ behavior: 'smooth', block: 'center' });
    }, 100);

  } catch (err) {
    console.error(err);
    alert('Error: ' + err.message);
  }
}

/* ============ DOWNLOAD PNG — HANYA QR, NAMA FILE = TANGGAL ============ */
function downloadPNG() {
  const qrEl = document.querySelector('#qrcode canvas') || document.querySelector('#qrcode img');
  if (!qrEl) { alert('Generate QR dulu.'); return; }

  const tanggal = document.getElementById('qrcode').getAttribute('data-tanggal');
  if (!tanggal) { alert('Data tanggal tidak ditemukan. Generate ulang.'); return; }

  const qrWidth  = qrEl.width  || qrEl.naturalWidth  || 360;
  const qrHeight = qrEl.height || qrEl.naturalHeight || 360;

  // Padding minimalis — hanya QR tanpa teks tambahan
  const padding = 20;

  const canvas = document.getElementById('canvas');
  canvas.width  = qrWidth + padding * 2;
  canvas.height = qrHeight + padding * 2;

  const ctx = canvas.getContext('2d');

  // Background putih
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Hanya QR Code — tidak ada teks lain
  ctx.drawImage(qrEl, padding, padding);

  // Nama file = tanggal (format YYYY-MM-DD)
  const filename = tanggal + '.png';

  const link = document.createElement('a');
  link.download = filename;
  link.href = canvas.toDataURL('image/png');
  link.click();
}

/* ============ COPY PAYLOAD ============ */
function copyPayload() {
  const encrypted = document.getElementById('qrcode').getAttribute('data-encrypted');
  if (!encrypted) {
    alert('Generate QR dulu.');
    return;
  }
  navigator.clipboard.writeText(encrypted)
    .then(() => {
      alert('✅ Payload terenkripsi berhasil di-copy ke clipboard.\n\nTempel di verify.html untuk verifikasi.');
    })
    .catch(() => {
      // Fallback browser lama
      const ta = document.createElement('textarea');
      ta.value = encrypted;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        alert('✅ Payload berhasil di-copy.');
      } catch (e) {
        alert('Gagal copy. Silakan gunakan tombol Download PNG.');
      }
      document.body.removeChild(ta);
    });
}
</script>
</body>
</html>
